<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Scheduler Dashboard</title>
    <!-- Premium Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #a855f7;
            --accent-hover: #9333ea;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --font-family: 'Outfit', sans-serif;
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.25);
            --glass-blur: blur(16px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        header {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto 2.5rem auto;
            text-align: center;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #e879f9 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }

        main {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
            animation: fadeInUp 0.8s ease;
        }

        @media (max-width: 968px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 8px 32px 0 rgba(99, 102, 241, 0.15);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.75rem;
        }

        h2 svg {
            width: 24px;
            height: 24px;
            fill: var(--primary);
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label svg {
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
        }

        input, textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            font-family: var(--font-family);
            font-size: 1rem;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success) 0%, #0ea5e9 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 6px;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .btn-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .actions-row {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .actions-row .btn {
            flex: 1;
        }

        /* Queue List */
        .queue-container {
            margin-top: 2rem;
        }

        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        /* Custom Scrollbar */
        .queue-list::-webkit-scrollbar, .modal-body::-webkit-scrollbar {
            width: 6px;
        }
        .queue-list::-webkit-scrollbar-track, .modal-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }
        .queue-list::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .queue-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            animation: slideIn 0.3s ease;
            transition: background 0.3s ease;
        }

        .queue-item:hover {
            background: rgba(15, 23, 42, 0.6);
            border-color: rgba(99, 102, 241, 0.2);
        }

        .queue-details {
            flex-grow: 1;
            min-width: 0;
        }

        .queue-topic {
            font-weight: 500;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .queue-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .queue-meta-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .queue-meta-item svg {
            width: 12px;
            height: 12px;
            fill: var(--text-secondary);
        }

        .empty-state {
            color: var(--text-secondary);
            text-align: center;
            padding: 2rem 0;
            font-size: 0.95rem;
            font-style: italic;
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-height: 85vh;
            animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: flex-end;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 1.5rem auto;
        }

        .log-box {
            background: #090d16;
            color: #10b981;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid rgba(16, 185, 129, 0.2);
            text-align: left;
            margin-top: 1rem;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(30, 41, 59, 0.95);
            border-left: 4px solid var(--primary);
            border-radius: 6px;
            padding: 1rem 1.5rem;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 280px;
            max-width: 400px;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left-color: var(--success);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        /* Keyframes */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Social Scheduler Dashboard</h1>
        <div class="subtitle">Configure platform credentials, draft posts, and dispatch updates dynamically.</div>
    </header>

    <main>
        <!-- Left Column: Configurations -->
        <section class="glass-card">
            <h2>
                <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
                Platform Credentials Configuration
            </h2>
            <form id="configForm" onsubmit="saveConfig(event)">
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" style="fill:#229ED9"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.11.02-1.93 1.23-5.46 3.62-.51.35-.98.53-1.39.51-.46-.01-1.35-.26-2.01-.48-.81-.27-1.46-.42-1.4-.88.03-.24.38-.49 1.04-.75 4.08-1.77 6.81-2.95 8.18-3.54 3.89-1.66 4.7-1.95 5.22-1.96.12 0 .38.03.55.17.14.12.18.28.2.42-.01.06-.01.12-.02.18z"/></svg>
                        Telegram Bot Token
                    </label>
                    <input type="text" id="TELEGRAM_BOT_TOKEN" placeholder="e.g. 123456789:ABCdefGhI...">
                </div>
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" style="fill:#229ED9"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
                        Telegram Chat ID
                    </label>
                    <input type="text" id="TELEGRAM_CHAT_ID" placeholder="e.g. -100123456789">
                </div>
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" style="fill:#E1306C"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                        Instagram Username
                    </label>
                    <input type="text" id="INSTAGRAM_USERNAME" placeholder="Username or Email">
                </div>
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" style="fill:#E1306C"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
                        Instagram Password
                    </label>
                    <input type="password" id="INSTAGRAM_PASSWORD" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" style="fill:#0A66C2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                        LinkedIn Access Token
                    </label>
                    <textarea id="LINKEDIN_ACCESS_TOKEN" placeholder="Long-lived Access Token"></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" style="fill:#0A66C2"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                        LinkedIn Person URN
                    </label>
                    <input type="text" id="LINKEDIN_PERSON_URN" placeholder="e.g. zYuUwoKDxA">
                </div>
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" style="fill:#a855f7"><path d="M12 2c5.522 0 10 4.477 10 10s-4.478 10-10 10S2 17.523 2 12 6.478 2 12 2zm-1.25 5.5a1.25 1.25 0 100 2.5 1.25 1.25 0 000-2.5zm2.5 0a1.25 1.25 0 100 2.5 1.25 1.25 0 000-2.5zm-5 4a1.25 1.25 0 100 2.5 1.25 1.25 0 000-2.5zm7.5 0a1.25 1.25 0 100 2.5 1.25 1.25 0 000-2.5zm-5 4a1.25 1.25 0 100 2.5 1.25 1.25 0 000-2.5zm2.5 0a1.25 1.25 0 100 2.5 1.25 1.25 0 000-2.5z"/></svg>
                        Groq API Key
                    </label>
                    <input type="password" id="GROQ_API_KEY" placeholder="gsk_...">
                </div>
                <button type="submit" class="btn btn-primary btn-icon" style="width: 100%; margin-top: 1rem;">
                    <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
                    Save Configuration
                </button>
            </form>
        </section>

        <!-- Right Column: Dispatcher & Queue -->
        <section class="glass-card">
            <h2>
                <svg viewBox="0 0 24 24"><path d="M19 3H4.99c-1.11 0-1.98.89-1.98 2L3 19c0 1.1.88 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10zm-3-5h-3V7h-2v3H8l4 4 4-4z"/></svg>
                New Post Dispatcher
            </h2>
            <form id="scheduleForm">
                <div class="form-group">
                    <label>Post Topic (be descriptive for AI generation)</label>
                    <textarea id="topicInput" placeholder="Describe the topic and details you want the AI to generate platform-specific content about..." required style="min-height: 120px;"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>
                            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
                            Date
                        </label>
                        <input type="date" id="dateInput">
                    </div>
                    <div class="form-group">
                        <label>
                            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                            Time
                        </label>
                        <input type="time" id="timeInput">
                    </div>
                </div>
                <div class="actions-row">
                    <button type="button" onclick="schedulePost()" class="btn btn-primary btn-icon">
                        <svg viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
                        Schedule Post
                    </button>
                    <button type="button" onclick="publishNow()" class="btn btn-success btn-icon">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        Publish Now
                    </button>
                </div>
            </form>

            <!-- Active Queue -->
            <div class="queue-container">
                <h2>
                    <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
                    Scheduled Queue
                </h2>
                <div class="queue-list" id="queueList">
                    <!-- Dynamic Items will appear here -->
                    <div class="empty-state">Loading scheduled queue...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal for showing generation status / terminal logs -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Publishing Status</div>
            </div>
            <div class="modal-body" id="modalBody" style="text-align: center;">
                <div class="spinner" id="modalSpinner"></div>
                <p id="modalStatusText">Generating and posting content to all channels. Please stand by...</p>
                <div class="log-box" id="modalLogs" style="display: none;"></div>
            </div>
            <div class="modal-footer" id="modalFooter" style="display: none;">
                <button class="btn btn-primary" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Constants & State
        const API_BASE = '/api';

        // Load configuration and list of posts on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            loadPosts();
            
            // Set default date as today
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('dateInput').value = `${yyyy}-${mm}-${dd}`;
            
            // Set default time as 1 hour from now (rounded)
            const hh = String((today.getHours() + 1) % 24).padStart(2, '0');
            const min = '00';
            document.getElementById('timeInput').value = `${hh}:${min}`;
        });

        // Toast Messages helper
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = '';
            if (type === 'success') {
                icon = `<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#10b981;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
            } else {
                icon = `<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#ef4444;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>`;
            }
            
            toast.innerHTML = `${icon}<span>${message}</span>`;
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 50);
            
            // Dismiss
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        const keys = [
            'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID',
            'INSTAGRAM_USERNAME', 'INSTAGRAM_PASSWORD',
            'LINKEDIN_ACCESS_TOKEN', 'LINKEDIN_PERSON_URN',
            'GROQ_API_KEY'
        ];

        // Fetch Configuration from localStorage
        function loadConfig() {
            try {
                keys.forEach(k => {
                    const val = localStorage.getItem(k);
                    const el = document.getElementById(k);
                    if (el && val) el.value = val;
                });
            } catch (err) {
                console.error('Failed to load local storage credentials.', err);
            }
        }

        // Save Configuration Form to localStorage
        async function saveConfig(e) {
            e.preventDefault();
            try {
                keys.forEach(k => {
                    const val = document.getElementById(k).value.trim();
                    localStorage.setItem(k, val);
                });
                showToast('Configuration saved securely in your browser!');
            } catch (err) {
                showToast('Failed to save configuration locally.', 'error');
            }
        }

        // Helper to get credentials payload
        function getCredentialsPayload() {
            const payload = {};
            keys.forEach(k => {
                payload[k] = document.getElementById(k).value.trim();
            });
            return payload;
        }

        // Fetch and Render Scheduled Posts List
        async function loadPosts() {
            const queueList = document.getElementById('queueList');
            try {
                const response = await fetch(`${API_BASE}/posts`);
                const posts = await response.json();
                
                if (posts.length === 0) {
                    queueList.innerHTML = '<div class="empty-state">No posts scheduled in the queue.</div>';
                    return;
                }
                
                queueList.innerHTML = '';
                
                // Sort posts: future first
                posts.sort((a,b) => new Date(a.schedule_time) - new Date(b.schedule_time));
                
                posts.forEach(post => {
                    const item = document.createElement('div');
                    item.className = 'queue-item';
                    
                    const topicDisplay = post.topic.replace(/\n/g, ' ');
                    
                    item.innerHTML = `
                        <div class="queue-details">
                            <div class="queue-topic" title="${post.topic}">${escapeHTML(topicDisplay)}</div>
                            <div class="queue-meta">
                                <div class="queue-meta-item">
                                    <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
                                    <span>${post.schedule_time}</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="deletePost(${post.id})" class="btn btn-danger btn-icon" title="Cancel schedule">
                            <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:white;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    `;
                    queueList.appendChild(item);
                });
            } catch (err) {
                queueList.innerHTML = '<div class="empty-state" style="color:var(--danger);">Failed to load queue.</div>';
            }
        }

        // Schedule a New Post
        async function schedulePost() {
            const topic = document.getElementById('topicInput').value.trim();
            const date = document.getElementById('dateInput').value;
            const time = document.getElementById('timeInput').value;
            
            if (!topic) {
                showToast('Please specify a topic.', 'error');
                return;
            }
            
            const creds = getCredentialsPayload();
            const payload = {
                topic,
                date,
                time,
                ...creds
            };
            
            try {
                const response = await fetch(`${API_BASE}/schedule`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const res = await response.json();
                if (response.ok) {
                    showToast(res.message);
                    document.getElementById('topicInput').value = '';
                    loadPosts();
                } else {
                    showToast(res.detail || 'Scheduling failed', 'error');
                }
            } catch (err) {
                showToast('Server error while scheduling.', 'error');
            }
        }

        // Cancel and Delete Scheduled Post
        async function deletePost(id) {
            if (!confirm('Are you sure you want to cancel this scheduled post?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/posts/${id}`, {
                    method: 'DELETE'
                });
                
                const res = await response.json();
                if (response.ok) {
                    showToast(res.message);
                    loadPosts();
                } else {
                    showToast(res.detail || 'Deletion failed', 'error');
                }
            } catch (err) {
                showToast('Server error while deleting.', 'error');
            }
        }

        // Publish Post Immediately (Publish Now)
        async function publishNow() {
            const topic = document.getElementById('topicInput').value.trim();
            if (!topic) {
                showToast('Please specify a topic to publish.', 'error');
                return;
            }
            
            const creds = getCredentialsPayload();
            const payload = {
                topic,
                ...creds
            };
            
            // Open progress modal
            const overlay = document.getElementById('modalOverlay');
            const spinner = document.getElementById('modalSpinner');
            const statusText = document.getElementById('modalStatusText');
            const logsBox = document.getElementById('modalLogs');
            const footer = document.getElementById('modalFooter');
            
            overlay.style.display = 'flex';
            spinner.style.display = 'block';
            statusText.innerText = 'AI is writing custom posts and publishing to Telegram, Instagram, and LinkedIn...';
            logsBox.style.display = 'none';
            footer.style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/publish-now`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const res = await response.json();
                
                spinner.style.display = 'none';
                footer.style.display = 'flex';
                
                if (response.ok) {
                    statusText.innerHTML = '<span style="color:var(--success); font-weight: 600;">✓ Post Dispatched Successfully!</span>';
                    logsBox.innerText = res.logs || 'Publishing finished without detailed logs.';
                    logsBox.style.display = 'block';
                    showToast('Post published successfully!');
                    document.getElementById('topicInput').value = '';
                } else {
                    statusText.innerHTML = '<span style="color:var(--danger); font-weight: 600;">✗ Publishing Failed</span>';
                    logsBox.innerText = res.detail || 'Unknown server error during publishing.';
                    logsBox.style.display = 'block';
                    showToast('Failed to publish post.', 'error');
                }
            } catch (err) {
                spinner.style.display = 'none';
                footer.style.display = 'flex';
                statusText.innerHTML = '<span style="color:var(--danger); font-weight: 600;">✗ Connection Error</span>';
                logsBox.innerText = 'Network error while attempting to connect to publisher endpoint: ' + err.toString();
                logsBox.style.display = 'block';
                showToast('Server connection failed.', 'error');
            }
        }

        // Helpers
        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }
        
        function escapeHTML(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
