services:
  - type: web
    name: social-scheduler-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_web:app --host 0.0.0.0 --port $PORT
    disk:
      name: scheduler-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_PATH
        value: /data/scheduled_posts.db
